name: Cleaning

on:
  schedule:
    - cron: 1 1 * * 1
  workflow_dispatch:

jobs:
  
  Cleanup-Old-Releases:
    runs-on: ubuntu-24.04
    steps:  
    - name: Delete Older Releases
      # 固定 commit SHA：v0.3.4 = dfbe6be（供应链锁定，原 @master 可被 force-push）
      uses: dev-drprasad/delete-older-releases@dfbe6be2a006e9475dfcbe5b8d201f1824c2a9fe
      with:
        keep_latest: 20
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

  Cleanup-Old-Artifacts:
    runs-on: ubuntu-24.04
    steps:
    - name: Cleanup Old Action Artifacts
      # 固定 commit SHA：v1.8.0 = 62c2fbe
      uses: c-hive/gha-remove-artifacts@62c2fbea931baa7dd4a6b73ea5a799984a818f61
      with:
          age: '3 days'
          skip-recent: 3
      continue-on-error: true
        
  Cleanup-Workflow-Logs:
    runs-on: ubuntu-24.04
    steps:
      - name: Cleanup Workflow Logs
        # 固定 commit SHA：v2.1.0 = b301838
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 3
        continue-on-error: true
